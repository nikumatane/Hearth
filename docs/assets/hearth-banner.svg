<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title description">
  <title id="title">Hearth</title>
  <desc id="description">A quiet home for your game servers.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1200" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B1018"/>
      <stop offset=".55" stop-color="#111827"/>
      <stop offset="1" stop-color="#171528"/>
    </linearGradient>
    <linearGradient id="ember" x1="205" y1="65" x2="365" y2="294" gradientUnits="userSpaceOnUse">
