  <rect x="168" y="62" width="224" height="224" rx="64" fill="#111923" stroke="#FFFFFF" stroke-opacity=".1"/>
  <path d="M290 88c4 35-25 51-10 84 8-22 29-29 32-59 29 29 45 61 41 94-4 43-39 70-80 70s-72-30-69-73c3-37 30-62 55-88-3 29 8 43 18 56 0-36 19-52 13-84Z" fill="url(#ember)"/>
  <path d="M276 251c-20 0-35-14-34-33 0-16 11-29 26-44-1 17 6 27 14 33-1-18 10-29 19-40 13 17 21 34 18 51-2 20-19 33-43 33Z" fill="#FFF4DB" fill-opacity=".93"/>
